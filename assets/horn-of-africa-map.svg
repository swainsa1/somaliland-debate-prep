<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 774" role="img" aria-labelledby="t d" font-family="Inter, Helvetica, Arial, sans-serif">
<title id="t">Map of Somaliland and its neighbors</title>
<desc id="d">Simplified map of the Horn of Africa showing Somaliland, Somalia, Djibouti, Ethiopia, Eritrea, Kenya and Yemen, with the Gulf of Aden, Red Sea, Bab el-Mandeb and key cities.</desc>
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#e9c46a"/><line x1="0" y1="0" x2="0" y2="7" stroke="#b5651d" stroke-width="3"/></pattern>
<style>
.sea{fill:#cfe3ee} .land{stroke:#ffffff;stroke-width:1.4;stroke-linejoin:round}
.sl{fill:#2a9d8f} .so{fill:#9fb7c9} .dj{fill:#e76f51} .et{fill:#e8dcc4} .er{fill:#ddd2bb} .ke{fill:#e3d8c0} .ye{fill:#d9cbb0}
.dis{fill:url(#hatch);stroke:#b5651d;stroke-width:1.2;stroke-dasharray:4 3;opacity:.9}
.country{font-size:15px;font-weight:700;fill:#3b3b3b;letter-spacing:1.5px}
.country-sl{font-size:16px;font-weight:800;fill:#ffffff;letter-spacing:1.5px}
.water{font-size:13px;font-style:italic;fill:#3d6f8e;letter-spacing:2px}
.city{font-size:12px;fill:#1d1d1d;font-weight:600;paint-order:stroke;stroke:#ffffff;stroke-width:3px}
.note{font-size:11px;fill:#5a3410;font-weight:600;paint-order:stroke;stroke:#fff8e6;stroke-width:3px}
.dot{fill:#1d1d1d;stroke:#fff;stroke-width:1.2} .star{fill:#ffd166;stroke:#1d1d1d;stroke-width:1} .port{fill:#264653;stroke:#fff;stroke-width:1.2}
.route{fill:none;stroke:#3d6f8e;stroke-width:2;stroke-dasharray:6 5}
.legend{font-size:12px;fill:#1d1d1d}
</style></defs>
